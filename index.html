<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三色图制作器</title>
<meta name="description" content="在线制作「稳定 / 速度 / 便宜」三色韦恩图表情包：自定义颜色、文字、大小，导出 PNG / JPG / WebP / SVG，一键生成转圈圈 GIF 动图。">
<meta property="og:title" content="三色图制作器 · Venn Meme Maker">
<meta property="og:description" content="自定义三色韦恩图，导出多种格式图片，生成转圈圈表情包 GIF。Make three-circle Venn memes and spinning GIFs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='11.5' r='9' fill='%23da3e41'/%3E%3Ccircle cx='11' cy='20' r='9' fill='%23efe84d' fill-opacity='.85'/%3E%3Ccircle cx='21' cy='20' r='9' fill='%2353b0db' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="11.5" r="9" fill="#da3e41"/>
      <circle cx="11" cy="20" r="9" fill="#efe84d" fill-opacity=".85"/>
      <circle cx="21" cy="20" r="9" fill="#53b0db" fill-opacity=".85"/>
    </svg>
    <span><b data-i18n="title">三色图制作器</b><small data-i18n="tagline">不可能三角 · 表情包生成</small></span>
  </a>
  <nav class="top-actions">
    <x-select id="langSelect" class="lang-select" data-i18n-aria="language" aria-label="语言"></x-select>
    <button class="btn ghost" id="shareBtn" type="button" data-i18n="share">复制分享链接</button>
    <button class="btn ghost" id="resetBtn" type="button" data-i18n="reset">恢复默认</button>
    <a class="btn ghost" href="https://github.com/JustLikeCheese/sansetu" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main class="app">
  <section class="stage">
    <div class="card stage-card">
      <div class="stage-head">
        <div class="seg" role="tablist" data-i18n-aria="previewMode" aria-label="预览模式">
          <button type="button" role="tab" data-mode="static" aria-selected="true" data-i18n="modeStatic">静态图</button>
          <button type="button" role="tab" data-mode="anim" aria-selected="false" data-i18n="modeAnim">动图预览</button>
        </div>
        <button class="btn small" id="playBtn" type="button" hidden>暂停</button>
        <div class="stage-tools">
          <button class="btn icon-btn" id="undoBtn" type="button" data-i18n-title="undoTitle" data-i18n-aria="undoTitle" aria-label="撤销" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 3.5 9l4 4M4 9h7.5a5 5 0 0 1 0 10H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn icon-btn" id="redoBtn" type="button" data-i18n-title="redoTitle" data-i18n-aria="redoTitle" aria-label="重做" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 5l4 4-4 4M16 9H8.5a5 5 0 0 0 0 10H11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <x-check class="switch" id="dragToggle" data-i18n-title="dragToggleTitle"><span data-i18n="dragToggle">拖动编辑</span></x-check>
        </div>
        <span class="dim" id="sizeInfo"></span>
      </div>
      <div class="canvas-area">
        <div class="canvas-box checker" id="canvasBox">
          <canvas id="view" data-i18n-aria="previewAlt" aria-label="三色图预览"></canvas>
          <div class="play-badge" id="stageBadge" hidden></div>
        </div>
      </div>
      <p class="hint" id="hint" data-i18n="hintStaticLocked">单击文字直接编辑，右键更多选项</p>
    </div>

    <div class="card export-card">
      <div class="export-group">
        <div class="export-head">
          <b data-i18n="exportStatic">静态图</b>
          <span class="inline-field"><span data-i18n="exportSize">导出尺寸</span>
            <x-select id="exportScale" data-k="exportScale" data-num data-i18n-aria="exportSize" aria-label="导出尺寸"></x-select>
          </span>
        </div>
        <div class="export-btns">
          <button class="btn" type="button" data-export="png">PNG</button>
          <button class="btn" type="button" data-export="jpg">JPG</button>
          <button class="btn" type="button" data-export="webp">WebP</button>
          <button class="btn" type="button" data-export="avif" hidden>AVIF</button>
          <button class="btn" type="button" data-export="svg">SVG</button>
          <button class="btn" type="button" data-export="bmp">BMP</button>
          <button class="btn" type="button" data-export="ico">ICO</button>
          <button class="btn" type="button" data-export="copy" data-i18n="copyImage">复制图片</button>
        </div>
      </div>
      <div class="export-group">
        <div class="export-head">
          <b data-i18n="exportAnim">动图 / 视频</b>
          <span class="dim" id="animInfo"></span>
        </div>
        <div class="export-btns">
          <button class="btn primary" type="button" data-export="gif">GIF</button>
          <button class="btn" type="button" data-export="apng">APNG</button>
          <button class="btn" type="button" data-export="webpa" data-i18n="fmtWebpAnim">WebP 动图</button>
          <button class="btn" type="button" data-export="video" data-i18n="fmtVideo">视频</button>
          <button class="btn" type="button" data-export="copygif" data-i18n="copyGif">复制 GIF</button>
        </div>
      </div>
    </div>

    <div class="card anim-card" id="animCard" hidden>
      <div class="gif-head"><b data-i18n="animResult">动图成品</b><span class="dim" id="animMeta"></span></div>
      <div class="anim-box checker" id="animBox" data-i18n-aria="clickPause" aria-label="点击画面暂停 / 继续" role="button" tabindex="0">
        <canvas id="animCanvas" hidden></canvas>
        <img id="animImg" data-i18n-alt="animResult" alt="动图成品" hidden>
        <video id="animVideo" loop muted playsinline hidden></video>
        <div class="play-badge" id="animBadge" hidden></div>
      </div>
      <p class="hint" data-i18n="clickPause">点击画面暂停 / 继续</p>
      <div class="row-btns">
        <a class="btn primary" id="animDownload" href="#" download>下载</a>
        <button class="btn" id="animCopy" type="button">复制</button>
        <button class="btn" id="animShare" type="button" data-i18n="shareFile" hidden>分享…</button>
        <button class="btn ghost" id="animClose" type="button" data-i18n="collapse">收起</button>
      </div>
    </div>
  </section>

  <aside class="panel">
    <details class="card sec" open>
      <summary data-i18n="presets">预设</summary>
      <div class="sec-body">
        <div class="sub" data-i18n="presetText">文案</div>
        <div class="chips" id="textPresets"></div>
        <div class="sub" data-i18n="presetColor">配色</div>
        <div class="chips" id="colorPresets"></div>
        <div class="sub" data-i18n="presetMix">交集颜色</div>
        <div class="chips" role="group" data-i18n-aria="presetMix" aria-label="交集颜色">
          <button class="chip" type="button" data-mix="custom" data-i18n="mixCustom" aria-pressed="true">自定义</button>
          <button class="chip" type="button" data-mix="avg" data-i18n="mixAvg" aria-pressed="false">由三圆平均混色</button>
          <button class="chip" type="button" data-mix="multiply" data-i18n="mixMultiply" aria-pressed="false">正片叠底混色</button>
        </div>
      </div>
    </details>

    <details class="card sec" open>
      <summary data-i18n="regionsTitle">文字与颜色</summary>
      <div class="sec-body">
        <div id="regionRows" class="region-list"></div>
        <p class="tip" data-i18n="regionsTip">文字框里按回车可以换行；清空文字即不显示。</p>
      </div>
    </details>

    <details class="card sec" open>
      <summary data-i18n="circles">圆圈</summary>
      <div class="sec-body">
        <div id="circleSliders" class="ctl-list"></div>
        <div class="ctl"><span class="ctl-label" data-i18n="strokeColor">描边颜色</span><x-color data-k="strokeColor" data-i18n-aria="strokeColor" aria-label="描边颜色"></x-color></div>
      </div>
    </details>

    <details class="card sec" open>
      <summary data-i18n="textStyle">文字样式</summary>
      <div class="sec-body">
        <div class="ctl"><span class="ctl-label" data-i18n="font">字体</span><x-select id="fontSelect" data-k="font" class="wide" data-i18n-aria="font" aria-label="字体"></x-select></div>
        <div id="textSliders" class="ctl-list"></div>
        <div class="ctl"><span class="ctl-label" data-i18n="strokeColor">描边颜色</span><x-color data-k="textStrokeColor" data-i18n-aria="strokeColor" aria-label="描边颜色"></x-color></div>
        <div class="row-btns"><button class="btn small" type="button" id="resetPos" data-i18n="resetPos">文字归位</button></div>
      </div>
    </details>

    <details class="card sec">
      <summary data-i18n="canvas">画布</summary>
      <div class="sec-body">
        <div class="ctl"><span class="ctl-label" data-i18n="background">背景色</span>
          <div class="ctl-inline">
            <x-color data-k="bg" data-i18n-aria="background" aria-label="背景色"></x-color>
            <x-check data-k="transparent"><span data-i18n="transparent">透明背景</span></x-check>
          </div>
        </div>
        <div id="canvasSliders" class="ctl-list"></div>
        <x-check data-k="square"><span data-i18n="square">正方形画布</span></x-check>
      </div>
    </details>

    <details class="card sec" open id="animSec">
      <summary data-i18n="animTitle">动图 · 转圈圈表情包</summary>
      <div class="sec-body">
        <div id="animSliders" class="ctl-list"></div>
        <p class="tip" data-i18n="fpsHint"></p>
        <div class="ctl"><span class="ctl-label" data-i18n="direction">方向</span>
          <x-select data-k="anim.dir" data-num class="wide" data-i18n-aria="direction" aria-label="方向">
            <x-option value="1" data-i18n="cw">顺时针</x-option>
            <x-option value="-1" data-i18n="ccw">逆时针</x-option>
          </x-select>
        </div>
        <div class="ctl"><span class="ctl-label" data-i18n="easing">转速曲线</span>
          <x-select data-k="anim.easing" class="wide" data-i18n-aria="easing" aria-label="转速曲线">
            <x-option value="outCubic" data-i18n="easeOutCubic">减速停下</x-option>
            <x-option value="outQuint" data-i18n="easeOutQuint">急刹车</x-option>
            <x-option value="inOutCubic" data-i18n="easeInOutCubic">慢 → 快 → 慢</x-option>
            <x-option value="outBack" data-i18n="easeOutBack">冲过头再回弹</x-option>
            <x-option value="linear" data-i18n="easeLinear">匀速</x-option>
          </x-select>
        </div>
        <div class="ctl"><span class="ctl-label" data-i18n="centerFx">中心字</span>
          <x-select data-k="anim.center" class="wide" data-i18n-aria="centerFx" aria-label="中心字">
            <x-option value="pop" data-i18n="fxPop">停下时弹一下</x-option>
            <x-option value="reveal" data-i18n="fxReveal">停下时才蹦出来</x-option>
            <x-option value="none" data-i18n="fxNone">无特效</x-option>
          </x-select>
        </div>
        <x-check data-k="anim.upright"><span data-i18n="upright">旋转时文字保持正向</span></x-check>
        <x-check data-k="anim.loop"><span data-i18n="loop">动图无限循环</span></x-check>
        <div class="row-btns">
          <button class="btn" type="button" id="previewAnim" data-i18n="previewAnim">预览动图</button>
          <button class="btn primary" type="button" data-export="gif" data-i18n="makeGif">生成 GIF 动图</button>
        </div>
      </div>
    </details>
  </aside>
</main>

<footer class="foot">
  <span data-i18n="footer">纯前端生成，图片不会上传到任何服务器</span> · <a href="https://github.com/JustLikeCheese/sansetu" target="_blank" rel="noopener" data-i18n="source">源码</a>
</footer>

<div class="ctx-menu" id="ctxMenu" role="menu" tabindex="-1" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="ui.js"></script>
<script src="gif.js"></script>
<script src="encoders.js"></script>
<script src="app.js"></script>
</body>
</html>
